name: Release Studio
run-name: Release Studio ${{ inputs.tag || github.ref_name }}

# This fork's release line. It produces an unsigned Windows build (zip +
# NSIS installer) and the CLI archives, and publishes them as a GitHub
# release on this repository.
#
# What it deliberately does not do, unlike upstream's workflow: no
# Authenticode signing, no macOS/Linux Studio packages, no R2 mirror, no
# signed update manifest, no npm/Homebrew publishing. Those all need
# credentials or infrastructure this fork does not own, and a release that
# silently skipped them would ship something it cannot update.
#
# Push a tag studio-vX.Y.Z to release. workflow_dispatch recovers a tag that
# already exists.
#
# Fork: this file replaces the upstream release line; see docs/STUDIO_RELEASE.md.

on:
  push:
    tags: ['studio-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing studio tag to publish (for example studio-v0.1.0)"
        required: true
        type: string

permissions:
  contents: write # create the release and upload artifacts

concurrency:
  group: release-studio-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      semver: ${{ steps.release.outputs.semver }}
      sha: ${{ steps.release.outputs.sha }}
      candidate: ${{ steps.release.outputs.candidate }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: release
        env:
          IN_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${IN_TAG:-$REF_NAME}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$tag" =~ ^studio-v(.+)$ ]] || [[ ! "${BASH_REMATCH[1]}" =~ $semver ]]; then
            echo "::error::studio release tag must be studio-vMAJOR.MINOR.PATCH[-PRERELEASE], got: $tag"
            exit 1
          fi
          # A dispatch recovers an existing tag; it must not invent one.
          sha="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          version="${tag#studio-}"
          # electron-builder wants a bare semver; the tag keeps the v.
          numeric="${version#v}"
          # Semver's prerelease segment, read from the grammar rather than the
          # spelling, so a candidate is marked prerelease on GitHub.
          candidate=false
          if [[ "$numeric" =~ $semver ]] && [ -n "${BASH_REMATCH[4]}" ]; then
            candidate=true
          fi
          { echo "tag=$tag"; echo "version=$version"; echo "semver=$numeric"; echo "sha=$sha"
            echo "candidate=$candidate"; } >> "$GITHUB_OUTPUT"
          echo "resolved $tag -> $version ($numeric) at $sha (candidate=$candidate)"

  windows:
    name: windows/amd64
    needs: resolve
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # The shell's package.json and the kernel it spawns both state the
      # version: app.getVersion() reads one, and the routes that install a
      # remote kernel name a release by the other.
      REASONIX_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # pnpm 10, not whatever corepack resolves: the lockfiles are v9 and a
      # newer major refuses them (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH).
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            desktop/frontend-next/pnpm-lock.yaml
            desktop/electron/pnpm-lock.yaml

      # Packaging writes a quarter of a gigabyte twice; the runner is thrown
      # away after the job, so if the image refuses the switch it is only slower.
      - name: Stop Defender scanning the build
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      # The SPA is read off disk beside the kernel rather than from app.asar.
      - name: Build the SPA
        working-directory: desktop/frontend-next
        shell: bash
        run: pnpm install --frozen-lockfile && pnpm build

      # The kernel the shell speaks to: a main-module binary, CGO-free.
      - name: Build the kernel
        working-directory: desktop/electron
        shell: bash
        run: pnpm install --frozen-lockfile && pnpm run build:host

      # Bundle, portable zip and installer in one pass. Upstream splits this
      # into stages because it signs the tree in between; with no certificate
      # there is nothing to do in between.
      - name: Package
        working-directory: desktop/electron
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec electron-builder --win zip nsis \
            -c.extraMetadata.version="${{ needs.resolve.outputs.semver }}"
          bundle=../../dist/win-unpacked/resources/bundled-plugins/live-compact
          test -s "$bundle/reasonix-plugin.json"
          test -s "$bundle/bin/live-compact.exe"

      - name: List the artifacts
        shell: bash
        run: ls -la dist/

      # Exact names, never a pattern: a release that quietly picked up a stray
      # file is worse than one that fails here.
      - uses: actions/upload-artifact@v7
        with:
          name: studio-windows-amd64
          path: |
            dist/ReasonixStudio-windows-amd64.zip
            dist/ReasonixStudio-windows-amd64-installer.exe
          if-no-files-found: error
          retention-days: 7

  cli:
    name: build the CLI archives
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend-next/pnpm-lock.yaml

      # serve.FindPage looks for frontend-next/dist next to the binary, so the
      # page is built once here rather than once per target.
      - name: Build the page
        working-directory: desktop/frontend-next
        run: pnpm install --frozen-lockfile && pnpm build

      # Every target the line claims to support, from one runner: the CLI is
      # CGO-free, so none of them needs a toolchain of its own.
      - name: Cross-compile and archive
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
          PAGE_DIR: desktop/frontend-next/dist
        run: |
          set -euo pipefail
          mkdir -p dist
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pkg=reasonix/internal/tools/productdocs
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION -X main.gitCommit=${SHA:0:12} -X main.buildTimeUTC=$built -X $pkg.linkedVersion=$VERSION -X $pkg.linkedRevision=$SHA" \
              -o "reasonix$ext" ./cmd/reasonix
            scripts/package-cli-archive.sh "$os" "$arch" "reasonix$ext" "$PAGE_DIR" dist
            rm -f "reasonix$ext"
          done
          # The digest list a remote installs against.
          (cd dist && sha256sum reasonix-* > SHA256SUMS)
          ls -la dist

      # A release that published the archives without the digest list is worse
      # than one that published neither: the routes resolve SHA256SUMS first.
      - name: Check the set is complete
        run: python3 scripts/check-cli-archives.py dist

      - uses: actions/upload-artifact@v7
        with:
          name: cli-archives
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the release
    needs: [resolve, windows, cli]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.windows.result == 'success' && needs.cli.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: studio-windows-amd64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: cli-archives
          path: dist

      # Notes come from the version's own file when it has one, and the
      # generated changelog always. Neither is required: this fork's notes
      # carry no credit block to keep in sync.
      - name: Notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # Written straight into dist/ so it is uploaded with everything else:
          # a release's notes are addressed as
          # releases/download/<tag>/notes.md by the version panel, and an
          # artifact this workflow keeps in $RUNNER_TEMP is one that address
          # cannot reach.
          notes="dist/notes.md"
          version_notes="release-notes/studio/${VERSION#v}.md"
          : > "$notes"
          if [ -f "$version_notes" ]; then
            node scripts/studio-release-notes.mjs "$version_notes" "$notes" || cat "$version_notes" >> "$notes"
            printf '\n' >> "$notes"
          fi
          previous_tag="$(git tag --merged "$SHA" --sort=-version:refname 'studio-v*' | grep -Fxv "$TAG" | head -n 1 || true)"
          if [ -n "$previous_tag" ]; then
            gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f previous_tag_name="$previous_tag" \
              --jq '.body' >> "$notes" 2>/dev/null || true
            printf '\n\n' >> "$notes"
          fi
          {
            printf '%s\n\n' '---'
            printf '**Windows** 包未签名，SmartScreen 会告警：选「更多信息」，再选「仍要运行」。\n\n'
            printf '这是个人 fork 的构建，与上游发布渠道无关：应用内检查更新只读本仓库的发布目录，不会把你带回官方版本。\n'
          } >> "$notes"

      # The updater resolves a release through two files this fork publishes
      # itself: latest.json (this version's platform -> installer mapping) and
      # versions.json (the catalog every check reads). Both are built here, from
      # the artifacts as they will be uploaded, so the digests in them are the
      # bytes a client actually receives.
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      # An artifact without a valid .minisig is one no client will install:
      # verify.go holds this fork's public key and refuse
      # anything else. Failing here rather than publishing unsigned packages
      # keeps "check for updates" from offering something that cannot apply.
      - name: Sign the artifacts
        working-directory: desktop
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_PRIVATE_KEY:-}" ]; then
            echo "::error::MINISIGN_PRIVATE_KEY is not configured, so no artifact could be signed"
            exit 1
          fi
          # The tool takes a subcommand first, then the files. Signatures are
          # skipped: a rerun meets the ones the first attempt wrote, and
          # signing a .minisig would only produce a .minisig.minisig.
          files=()
          for f in ../dist/ReasonixStudio-*; do
            case "$f" in
              *.minisig) continue ;;
            esac
            files+=("$f")
          done
          test "${#files[@]}" -gt 0
          go run ./cmd/sign sign "${files[@]}"

      - name: Write latest.json
        working-directory: desktop
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          go run ./cmd/studio-manifest ../dist             "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.tag }}"
          test -s ../dist/latest.json
          python3 -m json.tool ../dist/latest.json > /dev/null

      # The catalog carries every version this fork has published, newest
      # first, so a rollback can reach one. It is rebuilt from the previous
      # release's own copy plus this version, which is why a release must never
      # be deleted outright: doing so drops its entry from every later catalog.
      - name: Update versions.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p prev-catalog
          previous="$(git tag --merged "$SHA" --sort=-version:refname 'studio-v*' | grep -Fxv "$TAG" | head -n 1 || true)"
          if [ -n "$previous" ]; then
            gh release download "$previous" --pattern versions.json --dir prev-catalog --clobber || true
          fi
          python3 - "$TAG" "$VERSION" "$REPO" prev-catalog/versions.json dist/versions.json <<'PY'
          import datetime, json, os, sys
          tag, version, repo, previous, out = sys.argv[1:6]
          entries = []
          if os.path.exists(previous):
              with open(previous, encoding="utf-8") as fh:
                  entries = json.load(fh).get("versions", [])
          # Drop any stale row for the version being published: a rerun
          # rewrites the entry rather than listing the release twice.
          entries = [e for e in entries if e.get("version", "").lstrip("v") != version.lstrip("v")]
          entries.insert(0, {
              "version": version.lstrip("v"),
              "tag": tag,
              "channel": "prerelease" if "-" in version.lstrip("v") else "stable",
              "publishedAt": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "manifest": f"https://github.com/{repo}/releases/download/{tag}/latest.json",
          })
          catalog = {
              "schemaVersion": 1,
              "updatedAt": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "versions": entries,
          }
          with open(out, "w", encoding="utf-8") as fh:
              json.dump(catalog, fh, indent=2)
              fh.write("\n")
          print(f"catalog: {len(entries)} version(s), newest {version}")
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
        run: |
          set -euo pipefail
          notes="dist/notes.md"
          # Every file goes up, latest.json and versions.json included: the
          # catalog addresses a version through
          # releases/download/<tag>/latest.json, and the catalog itself is read
          # from releases/latest/download/versions.json, so both have to be
          # assets of the release they describe. A .minisig travels with the
          # artifact it signs, which the glob already pairs.
          assets=()
          for f in dist/*; do
            [ -f "$f" ] && assets+=("$f")
          done
          test "${#assets[@]}" -gt 0
          flags=()
          [ "$CANDIDATE" = "true" ] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "Reasonix Studio $VERSION" \
              --notes-file "$notes" \
              "${flags[@]}"
          fi

      - name: Summarize
        run: |
          {
            echo "### 产物"
            echo
            echo '| 文件 | 大小 |'
            echo '| --- | --- |'
            for f in dist/*; do
              printf '| %s | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
