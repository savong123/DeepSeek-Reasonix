name: diag secret
# Temporary: reports whether the signing secrets reached this run, by length
# only. Deleted once the release line signs.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          P: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          echo "MINISIGN_PRIVATE_KEY length=${#K}"
          echo "MINISIGN_PASSWORD length=${#P}"
          case "$K" in
            "untrusted comment:"*) echo "key starts with the expected comment line" ;;
            "") echo "::error::key is empty" ;;
            *) echo "::error::key does not start with the expected comment line" ;;
          esac
